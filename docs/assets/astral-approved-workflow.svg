ly the variable</text><text x="1029" y="630" fill="#a9b5bc" font-size="20" font-weight="400" text-anchor="start">table to each case</text><path d="M1338 390 H1818 L1856 428 V642 Q1856 660 1838 660 H1338 Q1320 660 1320 642 V408 Q1320 390 1338 390 Z" fill="#172024" stroke="#334348" stroke-width="1.8"/><path d="M1818 390 V417 Q1818 428 1829 428 H1856" fill="#223035" stroke="#334348" stroke-width="1.8"/><text x="1344" y="430" fill="#eeefeb" font-size="28" font-weight="600" text-anchor="start">Case report</text><text x="1344" y="464" fill="#a9b5bc" font-size="20" font-weight="400" text-anchor="start">One per triaged case</text><path d="M1344 486 H1828" fill="none" stroke="#334348" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1344" y="522" fill="#eeefeb" font-size="22" font-weight="600" text-anchor="start">Risk score</text><rect x="1344" y="541" width="210" height="22" rx="11" fill="url(#risk)" stroke="none" stroke-width="1.8"/><text x="1344" y="590" fill="#a9b5bc" font-size="17" font-weight="400" text-anchor="start">Lower</text><text x="1554" y="590" fill="#a9b5bc" font-size="17" font-weight="400" text-anchor="end">Higher</text><text x="1590" y="522" fill="#eeefeb" font-size="21" font-weight="500" text-anchor="start">Evidence &amp; rationale</text><path d="M1590 547 h222" fill="none" stroke="#a9b5bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1590 568 h172" fill="none" stroke="#a9b5bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1590 589 h200" fill="none" stroke="#a9b5bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1344" y="635" fill="#55c6d4" font-size="19" font-weight="500" text-anchor="start">Sets review priority</text><path d="M342 550 H383" fill="none" stroke="#a9b5bc" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M682 550 H747" fill="none" stroke="#a9b5bc" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M989 550 H999" fill="none" stroke="#a9b5bc" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1268 550 H1308" fill="none" stroke="#a9b5bc" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="324" y="782" width="420" height="146" rx="18" fill="#142b2d" stroke="#55c6d4" stroke-width="1.8"/><text x="350" y="816" fill="#55c6d4" font-size="18" font-weight="600" text-anchor="start">AT DEPLOYMENT</text><text x="350" y="860" fill="#eeefeb" font-size="33" font-weight="600" text-anchor="start">Real transcripts</text><text x="350" y="901" fill="#a9b5bc" font-size="21" font-weight="400" text-anchor="start">Held by deployer of ASTRAL</text><path d="M534 774 V673" fill="none" stroke="#55c6d4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aqua)"/><rect x="364" y="715" width="340" height="39" rx="0" fill="#0a0e0f" stroke="#0a0e0f" stroke-width="1.8"/><text x="534" y="742" fill="#55c6d4" font-size="23" font-weight="600" text-anchor="middle">Replaces synthetic input</text><path d="M1588 670 V777" fill="none" stroke="#55c6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aqua)"/><rect x="1450" y="790" width="276" height="131" rx="18" fill="#142b2d" stroke="#3d7b80" stroke-width="1.8"/><circle cx="1484" cy="827" r="9" fill="#55c6d4"/><path d="M1469 855 C1469 836 1499 836 1499 855" fill="none" stroke="#55c6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1513" y="836" fill="#eeefeb" font-size="25" font-weight="600" text-anchor="start">Human review</text><text x="1474" y="890" fill="#a9b5bc" font-size="19" font-weight="400" text-anchor="start">Highest-priority cases first</text><path d="M64 1011 H1856" fill="none" stroke="#253237" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="1046" fill