<svg xmlns="http://www.w3.org/2000/svg" width="1834" height="604" viewBox="50 334 1834 604" role="img" aria-labelledby="title desc"><title id="title">ASTRAL: Bio-misuse detection for AI transcripts</title><desc id="desc">A variable table generates synthetic transcripts and supplies the scanner rubric. Synthetic transcripts are used for training and testing only. At deployment, real transcripts held by the ASTRAL deployer replace the synthetic input. A multistage scanner selects concerning logs, characterizes them using the variable table, and passes the results to continuous risk scoring. Each case receives a report for prioritized human review.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#a9b5bc"/></marker><marker id="aqua" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#55c6d4"/></marker><linearGradient id="risk"><stop offset="0" stop-color="#55c6d4"/><stop offset="0.5" stop-color="#e8bf73"/><stop offset="1" stop-color="#f16e70"/></linearGradient></defs><rect width="1920" height="1080" fill="#0a0e0f"/><g font-family="Avenir Next, Avenir, Arial, sans-serif"><g transform="translate(64 55)"><g transform="translate(1.464788732,10.169014085) scale(0.704225352)"><circle cx="32" cy="6" r="3.4" fill="#f24b50"/><circle cx="27" cy="16" r="3.4" fill="#eeefeb"/><circle cx="37" cy="16" r="3.4" fill="#eeefeb"/><circle cx="22" cy="26" r="3.4" fill="#eeefeb"/><circle cx="42" cy="26" r="3.4" fill="#eeefeb"/><circle cx="17" cy="36" r="3.4" fill="#eeefeb"/><circle cx="27" cy="36" r="3.4" fill="#eeefeb"/><circle cx="37" cy="36" r="3.4" fill="#eeefeb"/><circle cx="47" cy="36" r="3.4" fill="#eeefeb"/><circle cx="12" cy="46" r="3.4" fill="#eeefeb"/><circle cx="52" cy="46" r="3.4" fill="#eeefeb"/><circle cx="7" cy="56" r="3.4" fill="#eeefeb"/><circle cx="57" cy="56" r="3.4" fill="#eeefeb"/></g><g fill="#eeefeb"><g transform="translate(58,9)"><path d=